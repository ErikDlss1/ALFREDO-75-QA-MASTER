  <rect x="0" y="2048" width="390" height="760" fill="#142337"/>
  <path d="M0 2044l18 8 19-11 20 8 18-11 18 9 20-11 21 8 19-10 20 8 18-11 20 9 18-10 21 9 18-10 19 8 20-9 22 9 20-10 18 9 20-10 22 9 18-9v18H0z" fill="#f1e4cf"/>
  <text x="24" y="1906" fill="#fff0dc" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="2.4">NOS ENCONTRAMOS EN</text>
