  <path d="M0 2784l23 10 20-9 18 11 20-8 22 10 18-11 19 9 20-12 20 11 20-10 20 10 20-11 18 11 20-10 19 9 18-10 20 9 18-11 20 9 19-11 20 10 18-8 20 9v18H0z" fill="#142337"/>

  <!-- Quiet pause: Photo 1 keeps its broad gesture intact at natural proportions. -->
  <rect x="0" y="3038" width="390" height="416" fill="#283248"/>
  <g clip-path="url(#pauseCrop)">
    <image href="../candidata-premium/public/images/alfredo-01.jpg" x="0" y="3038" width="390" height="416" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <!-- Photo 2 is a cropped memory that begins under the place and crosses into the pause. -->
  <g clip-path="url(#caveFragment)">
    <image href="../candidata-premium/public/images/alfredo-02.jpg" x="0" y="2585" width="402" height="660" preserveAspectRatio="xMidYMid slice"/>
    <path d="M228 2665h162v540H228z" fill="#18263b" opacity=".08"/>
