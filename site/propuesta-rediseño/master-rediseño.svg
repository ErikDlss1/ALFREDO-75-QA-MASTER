<svg xmlns="http://www.w3.org/2000/svg" width="390" height="6920" viewBox="0 0 390 6920" role="img" aria-labelledby="title desc">
  <title id="title">Master visual — Mis 75 años · Alfredo</title>
  <desc id="desc">Propuesta editorial vertical en tinta azul, papel marfil y rojo arcilla. Las fotografías originales forman una tira continua; el mapa se reserva para el mapa real en la implementación.</desc>
  <defs>
    <linearGradient id="heroShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a28" stop-opacity=".04"/>
      <stop offset=".53" stop-color="#101a28" stop-opacity=".04"/>
      <stop offset="1" stop-color="#101a28" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="rsvpShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c2b" stop-opacity=".12"/>
      <stop offset=".45" stop-color="#111c2b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#111c2b" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="venueInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142337" stop-opacity="0"/>
      <stop offset="1" stop-color="#142337" stop-opacity=".92"/>
    </linearGradient>
    <pattern id="grain" width="96" height="96" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="15" r=".75" fill="#26364a" opacity=".16"/>
      <circle cx="62" cy="31" r=".55" fill="#26364a" opacity=".12"/>
      <circle cx="35" cy="77" r=".7" fill="#26364a" opacity=".12"/>
      <path d="M10 48h11M71 84h9M46 8h6" stroke="#a55a49" stroke-width=".5" opacity=".15"/>
    </pattern>
    <clipPath id="heroCrop"><path d="M0 0H390V676l-18 10-16-8-20 14-19-8-19 13-20-9-21 14-18-9-20 13-21-10-18 10-19-8-20 10-18-8-20 11-17-8-17 7z"/></clipPath>
    <clipPath id="datePhoto"><path d="M232 887l158 18v390l-29 18-127-12-18-31 16-341z"/></clipPath>
    <clipPath id="venuePhoto"><path d="M0 1730h390v320l-17 8-15-7-18 12-17-7-16 10-21-9-18 12-19-8-15 11-18-9-17 12-19-8-19 9-19-11-19 8-19-10-20 11-18-9-18 9z"/></clipPath>
    <clipPath id="caveFragment"><path d="M228 2665l162 11v539l-19 11-16-8-16 14-20-12-16 11-18-9-19 13-18-11-20 11-18-12-17 10-18-11z"/></clipPath>
    <clipPath id="pauseCrop"><path d="M0 3038h390v416H0z"/></clipPath>
    <clipPath id="dressPhoto"><path d="M214 3656l141-14v514l-27 12-23-10-24 14-22-10-24 12-21-10z"/></clipPath>
    <clipPath id="rsvpPhoto"><path d="M0 5360h390v616l-20 10-18-12-19 12-18-11-19 13-20-12-20 11-18-11-18 10-19-12-19 11-18-10-18 9-19-12-19 10-18-10-19 11-18-9z"/></clipPath>
    <clipPath id="closingPrint"><path d="M244 6370h146v263l-18 12-18-10-20 13-20-12-18 11-17-10-18 9-17-12z"/></clipPath>
  </defs>

  <!-- Cover: Photo 7 carries the invitation; its full-body gesture and party lights set the tone. -->
  <rect width="390" height="6920" fill="#111c2b"/>
  <g clip-path="url(#heroCrop)">
