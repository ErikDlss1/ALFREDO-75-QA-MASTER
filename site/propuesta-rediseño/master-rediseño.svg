    <text x="47" y="33" fill="#f2e7d5" font-family="Arial, sans-serif" font-size="8" letter-spacing="1.8">TÓCAME PARA PAUSAR</text>
    <path d="M302 16h38m-7-7 7 7-7 7" fill="none" stroke="#f2e7d5" stroke-width="1"/>
  </g>
  <path d="M0 844h390" stroke="#d36a50" stroke-width="2"/>

