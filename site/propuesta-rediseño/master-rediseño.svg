  <path d="M0 844h390v866l-22 10-19-8-20 12-22-9-18 12-20-9-17 10-18-9-21 10-19-7-21 10-18-8-20 10-19-8-20 9-18-8-18 8-19-7-20 9-20-8-20 8-20-8-20 8V844z" fill="#f1e4cf"/>
