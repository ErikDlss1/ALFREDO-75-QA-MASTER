  <text x="49" y="4685" fill="#182638" font-family="Georgia, serif" font-size="31" letter-spacing="-1.1">Tu presencia es</text>
  <text x="49" y="4724" fill="#182638" font-family="Georgia, serif" font-size="31" letter-spacing="-1.1">lo más importante</text>
  <text x="49" y="4763" fill="#182638" font-family="Georgia, serif" font-size="31" letter-spacing="-1.1">para mí.</text>
  <text x="50" y="4841" fill="#342b31" font-family="Arial, sans-serif" font-size="14">No hace falta que me traigas un regalo.</text>
  <text x="50" y="4871" fill="#342b31" font-family="Arial, sans-serif" font-size="14">Si deseas tener un detalle conmigo,</text>
  <text x="50" y="4901" fill="#342b31" font-family="Arial, sans-serif" font-size="14">habrá un buzón en la entrada.</text>
  <path d="M0 5050h390v235H0z" fill="#152337"/>
  <path d="M42 5106h306v78H42z" fill="#101a28" stroke="#d36a50" stroke-width="1"/>
  <path d="M57 5145h275" stroke="#d8c8b5" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="195" y="5129" fill="#f2e7d5" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2">BUZÓN · EN LA ENTRADA</text>
  <path d="M172 5184l23 20 23-20" fill="none" stroke="#d36a50" stroke-width="2"/>

