    <rect x="0" y="0" width="390" height="700" fill="url(#heroShade)"/>
  </g>
  <path d="M24 34h47M24 40h27" stroke="#f2e7d5" stroke-width="1" opacity=".75"/>
  <text x="82" y="40" fill="#f5ead9" font-family="Arial, sans-serif" font-size="9" letter-spacing="2.1">INVITACIÓN · 14.11.26</text>
  <text x="22" y="572" fill="#d36a50" font-family="Georgia, serif" font-size="203" letter-spacing="-15">75</text>
  <text x="185" y="628" fill="#fff0db" font-family="Georgia, serif" font-size="48" letter-spacing="-2.5">Alfredo</text>
