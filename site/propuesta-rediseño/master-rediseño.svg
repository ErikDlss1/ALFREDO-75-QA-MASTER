  <text x="17" y="4021" fill="#bd5948" font-family="Georgia, serif" font-size="41" letter-spacing="-1.5">Casual</text>
  <text x="21" y="4070" fill="#182638" font-family="Georgia, serif" font-size="39" font-style="italic" letter-spacing="-1.2">elegante</text>
  <text x="24" y="4138" fill="#182638" font-family="Arial, sans-serif" font-size="13">Ven como te sientas bien.</text>
